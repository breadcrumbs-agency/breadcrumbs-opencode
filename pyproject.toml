[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "breadcrumbs-opencode"
version = "0.4.1"
description = "OpenCode adapter for breadcrumbs: identify and setup."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["breadcrumbs-common>=0.4.1,<0.5"]

[tool.setuptools]
packages = ["breadcrumbs_opencode"]
